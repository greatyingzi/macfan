name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: rustc -V && cargo -V

      - name: Format
        run: |
          rustup component add rustfmt
          cargo fmt --check

      - name: Lints
        run: |
          rustup component add clippy
          cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      - name: Build (arm64 + x86_64, universal)
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --profile dist --target aarch64-apple-darwin
          cargo build --profile dist --target x86_64-apple-darwin
          mkdir -p dist
          for b in macfan rsmc; do
            lipo -create -output "dist/$b" \
              "target/aarch64-apple-darwin/dist/$b" \
              "target/x86_64-apple-darwin/dist/$b"
            lipo -archs "dist/$b"
          done

      - name: Smoke test the binaries
        run: |
          ./dist/macfan --version
          ./dist/rsmc -v
          ./dist/macfan --help > /dev/null
