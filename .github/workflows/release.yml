name: Release

# Publishing a release is a tag push:
#
#   git tag -a v0.2.0 -m "macfan 0.2.0" && git push origin v0.2.0
#
# This builds universal (arm64 + x86_64) binaries from the tagged commit and
# attaches them to the release, so the published binaries always match the tag.

on:
  push:
    tags: ["v*"]
  # Re-running the cask step for a version, without cutting a new tag: the build
  # steps below are skipped, only the cask sync runs.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to sync the cask to (e.g. 0.2.6)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - if: startsWith(github.ref, 'refs/tags/')
        name: Build universal binaries
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --profile dist --target aarch64-apple-darwin
          cargo build --profile dist --target x86_64-apple-darwin
          mkdir -p dist
          for b in macfan rsmc; do
            lipo -create -output "dist/$b" \
              "target/aarch64-apple-darwin/dist/$b" \
              "target/x86_64-apple-darwin/dist/$b"
            echo "  $b: $(lipo -archs dist/$b)"
          done

      - if: startsWith(github.ref, 'refs/tags/')
        name: Smoke test
        run: |
          ./dist/macfan --version
          ./dist/rsmc -v
          ./dist/macfan --help > /dev/null

      - if: startsWith(github.ref, 'refs/tags/')
        name: App bundle and DMG
        run: |
          cargo build --release
          ( cd menubar && cargo build --release )
          menubar/scripts/make-app.sh
          menubar/scripts/make-dmg.sh
          lipo -archs dist/macfan.app/Contents/MacOS/macfan-menubar

      - if: startsWith(github.ref, 'refs/tags/')
        name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p pkg/macfan-universal
          cp dist/macfan dist/rsmc scripts/install.sh README.md LICENSE-MIT LICENSE-APACHE pkg/macfan-universal/
          chmod +x pkg/macfan-universal/install.sh
          ( cd pkg/macfan-universal && shasum -a 256 macfan rsmc > SHA256SUMS )
          tar czf macfan-universal.tar.gz -C pkg macfan-universal
          cp dist/macfan "macfan-${VERSION}-macos-universal"
          cp dist/rsmc "rsmc-${VERSION}-macos-universal"
          cp "dist/macfan-${VERSION}.dmg" "macfan-${VERSION}.dmg"
          shasum -a 256 macfan-universal.tar.gz "macfan-${VERSION}.dmg" \
            "macfan-${VERSION}-macos-universal" "rsmc-${VERSION}-macos-universal" > SHA256SUMS
          cat SHA256SUMS

      - if: startsWith(github.ref, 'refs/tags/')
        name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          V="${VERSION#v}"
          PRERELEASE=""
          case "$V" in *-*) PRERELEASE="--prerelease" ;; esac   # 0.2.0-rc1 etc.
          gh release view "$VERSION" >/dev/null 2>&1 || \
            gh release create "$VERSION" --title "macfan $V" --generate-notes $PRERELEASE
          gh release upload "$VERSION" --clobber \
            macfan-universal.tar.gz \
            "macfan-${V}.dmg" \
            "macfan-${V}-macos-universal" \
            "rsmc-${V}-macos-universal" \
            SHA256SUMS
          gh release view "$VERSION" --json assets --jq '.assets[] | "  \(.name)  \(.size) bytes"'

      - name: Update the Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          # `gh` needs a token even for a public release: without one it is
          # rate-limited by IP, which is how this step first failed.
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          V="${VERSION#v}"
          if [ -z "${TAP_DEPLOY_KEY:-}" ]; then
            echo "secrets.TAP_DEPLOY_KEY is not set, so this release does not bump the cask."
            echo "greatyingzi/homebrew-tap runs a scheduled sync that will pick it up within a day."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap
          chmod 600 ~/.ssh/tap
          # A deploy key is scoped to the one repository it was added to, which is
          # why it is used here rather than a personal token.
          export GIT_SSH_COMMAND="ssh -F /dev/null -i ~/.ssh/tap -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          for attempt in 1 2 3; do
            rm -rf /tmp/tap
            git clone -q git@github.com:greatyingzi/homebrew-tap.git /tmp/tap && break
            echo "clone attempt $attempt failed"; sleep 5
          done
          [ -d /tmp/tap/.git ] || { echo "could not clone the tap"; exit 1; }

          # One implementation, used here and by hand: it hashes the DMG that was
          # published, renders scripts/cask-template.rb, and reads the result back.
          bash scripts/update-cask.sh --dir /tmp/tap "$V"

          cd /tmp/tap
          git add -A
          if git diff --cached --quiet; then
            echo "the cask already matches $V"
            exit 0
          fi
          git -c user.name="macfan release" -c user.email="greatyingzi@users.noreply.github.com" \
            commit -q -m "macfan $V"
          git push -q origin HEAD:main
          echo "cask updated to $V"
